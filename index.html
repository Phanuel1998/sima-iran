    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping' || url.includes('/@vite-hmr') || url.includes('token='))) {
              var listeners = {};
              return {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                url: url,
                protocol: protocols || '',
                send: function() {},
                close: function() {},
                addEventListener: function(event, fn) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() { fn({ type: 'open' }); }, 5);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            String(event.reason).includes('WebSocket') ||
            String(event.reason?.message).includes('WebSocket') ||
            String(event.reason?.stack).includes('@vite/client') ||
            String(event.reason?.stack).includes('createWebSocketModuleRunnerTransport')
          )) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (
            String(event.message).includes('WebSocket') ||
            String(event.filename).includes('@vite/client')
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 overflow-hidden select-none">
