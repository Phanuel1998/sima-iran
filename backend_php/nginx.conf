# ==============================================================================
# پیکربندی وب‌سرور Nginx برای سامانه ثبت و مدیریت ویزیت فروشگاهی
# Nginx Server Block Configuration
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com; # دامنه یا IP سرور خود را جایگزین کنید
    root /var/www/field_sales; # مسیر فایل‌ها در سرور لینوکس
    index index.php index.html;

    charset utf-8;

    # مسیر عمومی فایل‌ها و ارسال درخواست‌ها به index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # پردازش اسکریپت‌های PHP از طریق PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # نسخه فست‌سی‌جی‌آی متناسب با سرور
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    # جلوگیری از دسترسی عمومی به فایل دیتابیس SQLite
    location ~ \.(db|sqlite|sqlite3)$ {
        deny all;
    }

    # کشینگ فایل‌های استاتیک
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
