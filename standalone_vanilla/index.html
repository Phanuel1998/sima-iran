<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Field Sales Route Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Full Screen Map -->
  <div id="map"></div>

  <!-- Top Floating HUD -->
  <header class="hud-header">
    <div class="hud-title-pill">
      <div class="hud-dot"></div>
      <span>Field Sales GPS</span>
    </div>
    <button id="btn-toggle-dashboard" class="btn-dashboard-toggle">
      📊 Dashboard (<span id="badge-count">0</span>)
    </button>
  </header>

  <!-- Bottom Floating Action Bar -->
  <div class="fab-container">
    <button id="btn-recenter" class="btn-fab-round" title="Center on My GPS">
      📍
    </button>
    <button id="btn-log-visit" class="btn-fab-log">
      <span>+ Log Shop Visit</span>
    </button>
  </div>

  <!-- Log Visit Modal -->
  <div id="modal-log" class="modal-overlay">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px; font-weight:800;">Log Shop Visit</h3>
        <button id="btn-close-modal" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>
      </div>

      <form id="form-visit">
        <div class="form-group">
          <label for="shop_name">Shop Name *</label>
          <input type="text" id="shop_name" name="shop_name" required placeholder="e.g. Downtown Grocers" />
        </div>

        <div class="form-group">
          <label for="phone_number">Phone Number</label>
          <input type="tel" id="phone_number" name="phone_number" placeholder="+1 (555) 012-3456" />
        </div>

        <div class="form-group">
          <label for="sale_status">Sale Status *</label>
          <select id="sale_status" name="sale_status" required>
            <option value="Sold">Sold (Green Pin)</option>
            <option value="Rejected">Rejected (Red Pin)</option>
            <option value="Callback">Callback / Follow-up (Yellow Pin)</option>
          </select>
        </div>

        <div class="form-group" id="group-sale-amount">
          <label for="sale_amount">Sale Amount ($)</label>
          <input type="number" id="sale_amount" name="sale_amount" min="0" step="0.01" value="0" />
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3" placeholder="Order details, feedback, contact person..."></textarea>
        </div>

        <!-- Hidden Coordinates auto-populated from GPS -->
        <input type="hidden" id="latitude" name="latitude" />
        <input type="hidden" id="longitude" name="longitude" />

        <div style="font-size:11px; color:#64748b; margin-bottom:14px;" id="coords-display">
          GPS: Acquiring coordinates...
        </div>

        <button type="submit" class="btn-submit">Save Visit Record</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Drawer -->
  <div id="drawer-dashboard" class="drawer-overlay">
    <div class="drawer-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="font-size:18px; font-weight:800;">Sales Dashboard</h3>
        <button id="btn-close-drawer" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <h4>Total Visited</h4>
          <div class="value" id="metric-total">0</div>
        </div>
        <div class="metric-card">
          <h4>Total Sales ($)</h4>
          <div class="value" style="color:#10b981;" id="metric-sales">$0.00</div>
        </div>
        <div class="metric-card">
          <h4>Conversion Rate</h4>
          <div class="value" style="color:#818cf8;" id="metric-conversion">0%</div>
        </div>
        <div class="metric-card">
          <h4>Breakdown</h4>
          <div style="font-size:12px; margin-top:4px; color:#94a3b8;">
            <span style="color:#10b981;">● <span id="metric-sold">0</span> Sold</span><br/>
            <span style="color:#ef4444;">● <span id="metric-rejected">0</span> Rej</span><br/>
            <span style="color:#f59e0b;">● <span id="metric-callback">0</span> Call</span>
          </div>
        </div>
      </div>

      <a id="btn-export-csv" href="/api/export" download="visits_export.csv" style="display:block; text-align:center; padding:12px; background:#334155; color:#fff; border-radius:10px; text-decoration:none; font-weight:700; margin-bottom:20px;">
        📥 Download CSV Export
      </a>

      <h4 style="font-size:14px; font-weight:700; margin-bottom:12px;">Visit History</h4>
      <div id="visits-list" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
